name: Assistant
options:
  bundleIdPrefix: com.yifanwang
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    CODE_SIGN_STYLE: Automatic
    # 个人免费团队的 Team ID: yifan Wang (Personal Team)
    DEVELOPMENT_TEAM: 3559VJC998
    TARGETED_DEVICE_FAMILY: "1"
    BUNDLE_ID: com.yifanwang.assistant01

packages:
  AssistantCore:
    path: Packages/AssistantCore
  # 端侧推理运行时。产物为 llama.cpp 的 xcframework（binaryTarget）。
  # 注意：该发布产物仅含真机切片，不含 iphonesimulator 架构。
  # 因此模拟器目标下仍会解析失败——这是上游产物限制，不是配置错误。
  # 端侧推理相关功能请在真机验证；`LlamaCppEngine.isEngineLinked` 会在
  # 未链接二进制时返回 false，UI 据此如实降级，不会误报「模型损坏」。
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    from: "2.0.0"

targets:
  Assistant:
    type: application
    platform: iOS
    sources:
      - Assistant
      - WidgetShared
    dependencies:
      - package: AssistantCore
      - package: LlamaSwift
        product: LlamaSwift
      - target: AssistantWidgetExtension
      - target: AssistantShareExtension
    entitlements:
      path: Assistant/Assistant.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yifanwang.assistant01
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SHORTCUTS_FLEXIBLE_MATCHING: "NO"
        ENABLE_APPINTENTS_DEPLOYMENT_AWARE_PROCESSING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Assistant/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.yifanwang.assistant01.refresh
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleDisplayName: 小助
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.yifanwang.assistant01
            CFBundleURLSchemes:
              - assistant
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: assistant.action.voice
            UIApplicationShortcutItemTitle: 语音对话
            UIApplicationShortcutItemSubtitle: 快速唤起离线语音助手
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAudio
          - UIApplicationShortcutItemType: assistant.action.add_todo
            UIApplicationShortcutItemTitle: 新建待办
            UIApplicationShortcutItemSubtitle: 快速创建日常待办与日程
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
          - UIApplicationShortcutItemType: assistant.action.expense
            UIApplicationShortcutItemTitle: 一句话记账
            UIApplicationShortcutItemSubtitle: 语音或打字自动记账
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: assistant.action.parcels
            UIApplicationShortcutItemTitle: 待取快递
            UIApplicationShortcutItemSubtitle: 快速查看所有取件码
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeTask
          - UIApplicationShortcutItemType: assistant.action.id_vault
            UIApplicationShortcutItemTitle: 证件保险箱
            UIApplicationShortcutItemSubtitle: 查阅身份证/护照/凭证
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeLove
        # 让 Documents 在「文件」App 中可见（inbox.txt 补录用）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: "需要麦克风权限以支持离线语音对话交互"
        NSSpeechRecognitionUsageDescription: "需要语音识别权限以离线转写你的语音指令"
        NSLocationWhenInUseUsageDescription: "需要定位权限以支持到达离开家、公司或驿站时的情景智能感知"
        NSLocationAlwaysAndWhenInUseUsageDescription: "需要后台定位与地理围栏权限以支持到达驿站附近时离线弹出取件提醒"
        NSFaceIDUsageDescription: "需要 Face ID 权限以保护你的重要证件照片与敏感数据安全"
        NSCameraUsageDescription: "需要相机权限以扫描二维码、拍摄证件和小票"
        NSPhotoLibraryAddUsageDescription: "需要相册写入权限以保存生成的待办分享卡片到相册"
        NSPhotoLibraryUsageDescription: "需要相册权限以选择壁纸、证件和小票照片"
        NSCalendarsUsageDescription: "需要日历权限以在今日安排中显示你的日程"
        NSCalendarsFullAccessUsageDescription: "需要完整日历权限以在今日安排中显示你的日程"
        NSMotionUsageDescription: "需要运动与健身权限以识别你正在乘车或骑行，到站前提醒清点随身物品"

  AssistantWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetShared
      - AssistantWidgetExtension
    entitlements:
      path: AssistantWidgetExtension/AssistantWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yifanwang.assistant01
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yifanwang.assistant01.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
    info:
      path: AssistantWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: 小助小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AssistantShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetShared
      - ShareExtension
    entitlements:
      path: ShareExtension/AssistantShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yifanwang.assistant01
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yifanwang.assistant01.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 发送到小助
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5

schemes:
  Assistant:
    build:
      targets:
        Assistant: all
        AssistantWidgetExtension: all
        AssistantShareExtension: all
    run:
      config: Debug
