name: Assistant
options:
  bundleIdPrefix: com.yifanwang
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    CODE_SIGN_STYLE: Automatic
    # 个人免费团队的 Team ID: yifan Wang (Personal Team)
    DEVELOPMENT_TEAM: 3559VJC998
    TARGETED_DEVICE_FAMILY: "1"
    BUNDLE_ID: com.yifanwang.assistant01

packages:
  AssistantCore:
    path: Packages/AssistantCore

targets:
  Assistant:
    type: application
    platform: iOS
    sources:
      - Assistant
      - WidgetShared
    dependencies:
      - package: AssistantCore
      - framework: Frameworks/llama.xcframework
        embed: true
      - target: AssistantWidgetExtension
      - target: AssistantShareExtension
      - target: AssistantWatch
    entitlements:
      path: Assistant/Assistant.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yifanwang.assistant01
        # Apple 健康只读接入所需的 entitlement。
        # 基础 HealthKit（步数/睡眠/饮水/能量）免费个人团队可用；
        # 受限的是「临床健康记录」子能力与后台投递（enableBackgroundDelivery），
        # 本工程两者都没用到。
        com.apple.developer.healthkit: true
        # 随 healthkit capability 自动带上，用于区分「临床健康记录」读取范围。
        # 本 App 不读临床记录，保留空数组表示不申请任何记录类型。
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SHORTCUTS_FLEXIBLE_MATCHING: "NO"
        ENABLE_APPINTENTS_DEPLOYMENT_AWARE_PROCESSING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Assistant/Info.plist
      properties:
        # 版本号必须在这里显式引用构建设置：XcodeGen 会给生成的 Info.plist 写死
        # 1.0/1，而不是读取 MARKETING_VERSION。此前 MARKETING_VERSION: "0.1.0"
        # 是一份死配置——改它不会进 IPA（主包与两个扩展已实测都恒为 1.0）。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BGTaskSchedulerPermittedIdentifiers:
          - com.yifanwang.assistant01.refresh
        # 只登记标识还不够：系统要求同时声明后台模式，否则 BGTaskScheduler.submit 直接抛错，
        # 而 BackgroundRefreshCoordinator 只 print 一句就静默过去——后台巡检此前从未真正跑过。
        UIBackgroundModes:
          - fetch
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleDisplayName: 小助
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.yifanwang.assistant01
            CFBundleURLSchemes:
              - assistant
        LSApplicationQueriesSchemes:
          - weixin
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: assistant.action.voice
            UIApplicationShortcutItemTitle: 语音对话
            UIApplicationShortcutItemSubtitle: 快速唤起离线语音助手
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAudio
          - UIApplicationShortcutItemType: assistant.action.add_todo
            UIApplicationShortcutItemTitle: 新建待办
            UIApplicationShortcutItemSubtitle: 快速创建日常待办与日程
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
          - UIApplicationShortcutItemType: assistant.action.expense
            UIApplicationShortcutItemTitle: 一句话记账
            UIApplicationShortcutItemSubtitle: 语音或打字自动记账
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: assistant.action.parcels
            UIApplicationShortcutItemTitle: 待取快递
            UIApplicationShortcutItemSubtitle: 快速查看所有取件码
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeTask
          - UIApplicationShortcutItemType: assistant.action.id_vault
            UIApplicationShortcutItemTitle: 证件保险箱
            UIApplicationShortcutItemSubtitle: 查阅身份证/护照/凭证
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeLove
        # 让 Documents 在「文件」App 中可见（inbox.txt 补录用）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: "需要麦克风权限以支持离线语音对话交互"
        NSSpeechRecognitionUsageDescription: "需要语音识别权限以离线转写你的语音指令"
        NSLocationWhenInUseUsageDescription: "需要定位权限以支持到达离开家、公司或驿站时的情景智能感知"
        NSLocationAlwaysAndWhenInUseUsageDescription: "需要后台定位与地理围栏权限以支持到达驿站附近时离线弹出取件提醒"
        NSFaceIDUsageDescription: "需要 Face ID 权限以保护你的重要证件照片与敏感数据安全"
        NSCameraUsageDescription: "需要相机权限以扫描二维码、拍摄证件和小票"
        NSPhotoLibraryAddUsageDescription: "需要相册写入权限以保存生成的待办分享卡片到相册"
        NSPhotoLibraryUsageDescription: "需要相册权限以选择壁纸、证件和小票照片"
        NSCalendarsUsageDescription: "需要日历权限以在今日安排中显示你的日程"
        NSCalendarsFullAccessUsageDescription: "需要完整日历权限以在今日安排中显示你的日程"
        NSMotionUsageDescription: "需要运动与健身权限以识别你正在乘车或骑行，到站前提醒清点随身物品"
        # Apple 健康：只读步数、睡眠、体温、活动/静息能量、心率、心率变异性(HRV)、静息心率、血氧、步行速度、体征与健身记录，
        # 用于在健康数据页与日报中提供压力状态、身心愉悦指数与生活调养建议。
        NSHealthShareUsageDescription: "需要读取你在「健康」中的心率变异性(HRV)、睡眠分期、心率、静息心率、活动能量与体征数据，用于在健康中心推断自主神经平衡与身心愉悦指数，并在日报中评估身体活力。数据仅在设备本机离线分析展示，绝不上传。"
        NSHealthUpdateUsageDescription: "需要写入权限以将你在助手里记录的饮水量同步至 Apple 健康。"
        NSLocalNetworkUsageDescription: "需要局域网与本地网络权限以支持面对面碰一碰交换待办清单、AA账单与心情名片"
        NSBonjourServices:
          - _asst-share._tcp
          - _asst-share._udp
        CFBundleDocumentTypes:
          - CFBundleTypeName: "小助离线数据包"
            CFBundleTypeRole: "Editor"
            LSHandlerRank: "Owner"
            LSItemContentTypes:
              - "com.yifanwang.assistant01.package"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: "com.yifanwang.assistant01.package"
            UTTypeDescription: "小助离线数据包"
            UTTypeConformsTo:
              - "public.data"
              - "public.content"
            UTTypeTagSpecification:
              public.filename-extension:
                - "assistant"
              public.mime-type:
                - "application/x-assistant"

  AssistantWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetShared
      - AssistantWidgetExtension
    dependencies:
      - package: AssistantCore
    entitlements:
      path: AssistantWidgetExtension/AssistantWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yifanwang.assistant01
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
    info:
      path: AssistantWidgetExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 小助小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AssistantShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetShared
      - ShareExtension
    dependencies:
      - package: AssistantCore
    entitlements:
      path: ShareExtension/AssistantShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yifanwang.assistant01
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 发送到小助
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5

  AssistantWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - AssistantWatch
      - WidgetShared/WidgetSnapshot.swift
      - Assistant/Assets.xcassets
    dependencies:
      - package: AssistantCore
    entitlements:
      path: AssistantWatch/AssistantWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yifanwang.assistant01
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.watchkitapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: AssistantWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 小助
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID)
        Supports Launch for Live Activity Attribute Types:
          - PickupActivityAttributes
          - TravelActivityAttributes
          - DepartureChecklistActivityAttributes
        CFBundleURLTypes:
          - CFBundleURLName: com.yifanwang.assistant01.watch
            CFBundleURLSchemes:
              - assistant

  # App 层单元测试。
  #
  # 之前 App 层没有测试 target，验收条目只存在于文档里，无法自动回归。
  # 现在把「App 层独有职责」钉成测试：
  # - SwiftData 模型 → Core 纯值事实的映射（Core 单测覆盖不到）；
  # - 横幅文案 / 提示色 / 可关闭性 / 分组标题的映射；
  # - 首页主题令牌（字号层级、圆角档位）与设计规格的一致性。
  #
  # 用 `@testable import Assistant` 访问内部类型，因此依赖 Assistant target。
  # 注意：llama.xcframework 含模拟器切片（arm64 + x86_64），测试可在模拟器跑。
  AssistantTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AssistantTests
    dependencies:
      - target: Assistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Assistant.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Assistant
        SWIFT_VERSION: "5.0"

schemes:
  Assistant:
    build:
      targets:
        Assistant: all
        AssistantWidgetExtension: all
        AssistantShareExtension: all
        AssistantWatch: all
        AssistantTests: [test]
    run:
      config: Debug
  AssistantWatch:
    build:
      targets:
        AssistantWatch: all
    run:
      config: Debug
  # 单独跑 App 层测试：xcodebuild test -scheme AssistantTests
  AssistantTests:
    build:
      targets:
        Assistant: all
        AssistantTests: [test]
    test:
      config: Debug
      targets:
        - AssistantTests
